name: Opt-in disposable Windows product journey
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ".github/workflows/windows-product-journey.yml"
      - "packaging/windows-msi/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "desktop/**"
      - "public/**"
      - "package*.json"
  workflow_dispatch:
    inputs:
      exercise_rollback:
        description: "Also create and execute the isolated TEST-ONLY full-product rollback fault"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build-product:
    if: github.repository == 'Hubujiu/local-api-workbench' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-windows-product-journey')))
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      head: ${{ steps.identity.outputs.head }}
      manifest_sha: ${{ steps.manifest.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.3"
      - name: Require committed candidate MSI version and bind exact head
        id: identity
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_HEAD) { throw 'Source head mismatch' }
          $version = node --input-type=module -e "import {desktopSourceVersion} from './scripts/desktop-package-version.mjs'; const v=await desktopSourceVersion(); const [a,b,c]=v.split('.').map(Number); if(a===0 && (b===0 || (b===1 && c===0))) throw Error('Candidate must be >=0.1.1'); console.log(v);"
          if ($LASTEXITCODE -ne 0) { throw 'Version-bound build prerequisite missing' }
          "head=$head" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - run: npm ci --ignore-scripts --no-audit
      - run: npm ci --prefix desktop --no-audit
      - run: npx --no install-electron
        working-directory: desktop
      - name: Locked production dependencies
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('production');for(const f of ['package.json','package-lock.json'])fs.copyFileSync(f,'production/'+f)"
          npm ci --omit=dev --ignore-scripts --prefix production --no-audit
      - run: npm run build:dameng
      - run: node scripts/build-desktop.mjs
      - run: node scripts/build-manifest.mjs
        env:
          BUILD_HEAD: ${{ steps.identity.outputs.head }}
      - run: node scripts/verify-portable.mjs
      - name: Independent manifest pin
        id: manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash -LiteralPath 'dist/LocalAPI/build-manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-journey-new-portable
          path: dist/LocalAPI
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  build-baseline:
    needs: build-product
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      head: ${{ steps.source.outputs.head }}
      version: ${{ steps.source.outputs.version }}
      manifest_sha: ${{ steps.attest.outputs.manifest_sha }}
      provenance_sha: ${{ steps.attest.outputs.provenance_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.build-product.outputs.head }}
          path: journey-authoring
          persist-credentials: false
      - name: Read dedicated exact-source lock (not historical archive hashes)
        id: source
        shell: pwsh
        run: |
          $lock = Get-Content -Raw journey-authoring/packaging/windows-msi/windows-baseline-source-lock.json | ConvertFrom-Json
          if ($lock.repository -cne 'Hubujiu/local-api-workbench' -or $lock.head -cnotmatch '^[0-9a-f]{40}$' -or $lock.version -cne '0.1.0' -or $lock.nodeVersion -cne '24.22.3') { throw 'Invalid baseline source identity' }
          "head=$($lock.head)" >> $env:GITHUB_OUTPUT
          "version=$($lock.version)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Hubujiu/local-api-workbench
          ref: ${{ steps.source.outputs.head }}
          path: baseline-source
          persist-credentials: false
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.3"
      - name: Verify exact historical source and locked dependency inputs
        run: python journey-authoring/scripts/attest_windows_baseline_source.py --lock journey-authoring/packaging/windows-msi/windows-baseline-source-lock.json --source baseline-source
      - run: npm ci --ignore-scripts --no-audit
        working-directory: baseline-source
      - run: npm ci --prefix desktop --no-audit
        working-directory: baseline-source
      - run: npx --no install-electron
        working-directory: baseline-source/desktop
      - name: Historical locked production dependencies
        working-directory: baseline-source
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('production');for(const f of ['package.json','package-lock.json'])fs.copyFileSync(f,'production/'+f)"
          npm ci --omit=dev --ignore-scripts --prefix production --no-audit
      - run: node scripts/build-desktop.mjs
        working-directory: baseline-source
      - run: node scripts/build-manifest.mjs
        working-directory: baseline-source
        env:
          BUILD_HEAD: ${{ steps.source.outputs.head }}
      - run: node scripts/verify-portable.mjs
        working-directory: baseline-source
      - name: Attest new source rebuild independently (not reproduction of original ZIP)
        id: attest
        shell: pwsh
        env:
          BUILDER_HEAD: ${{ needs.build-product.outputs.head }}
        run: |
          python journey-authoring/scripts/attest_windows_baseline_source.py --lock journey-authoring/packaging/windows-msi/windows-baseline-source-lock.json --source baseline-source --payload baseline-source/dist/LocalAPI --builder-head $env:BUILDER_HEAD --receipt source-rebuild.json
          if ($LASTEXITCODE -ne 0) { throw 'Baseline rebuild verification failed' }
          $receipt = Get-Content -Raw source-rebuild.json | ConvertFrom-Json
          "manifest_sha=$($receipt.manifestSha256)" >> $env:GITHUB_OUTPUT
          $sha = (Get-FileHash source-rebuild.json -Algorithm SHA256).Hash.ToLowerInvariant()
          "provenance_sha=$sha" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-journey-baseline-source-rebuild
          path: baseline-source/dist/LocalAPI
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: product-journey-baseline-provenance
          path: source-rebuild.json
          if-no-files-found: error
          retention-days: 3
  author-pair:
    needs: [build-product, build-baseline]
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      plan_sha: ${{ steps.bundle.outputs.plan_sha }}
      rollback_enabled: ${{ steps.bundle.outputs.rollback_enabled }}
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates git libglib2.0-0t64 libxml2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.build-product.outputs.head }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-journey-new-portable
          path: ${{ runner.temp }}/new-portable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-journey-baseline-source-rebuild
          path: ${{ runner.temp }}/baseline-portable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: product-journey-baseline-provenance
          path: ${{ runner.temp }}/baseline-provenance
      - name: Materialize pinned authoring tools
        shell: bash
        run: |
          python3 scripts/materialize_msi_tools.py "$RUNNER_TEMP/msitools"
      - name: Compile same-family pair and independently pin transferred plan
        id: bundle
        shell: bash
        env:
          EXERCISE_ROLLBACK: ${{ (inputs.exercise_rollback || contains(github.event.pull_request.labels.*.name, 'run-windows-product-rollback')) && 'true' || 'false' }}
          NEW_HEAD: ${{ needs.build-product.outputs.head }}
          NEW_MANIFEST_SHA: ${{ needs.build-product.outputs.manifest_sha }}
          NEW_VERSION: ${{ needs.build-product.outputs.version }}
          BASELINE_HEAD: ${{ needs.build-baseline.outputs.head }}
          BASELINE_VERSION: ${{ needs.build-baseline.outputs.version }}
          BASELINE_MANIFEST_SHA: ${{ needs.build-baseline.outputs.manifest_sha }}
          BASELINE_PROVENANCE_SHA: ${{ needs.build-baseline.outputs.provenance_sha }}
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/msitools/root/usr/lib/x86_64-linux-gnu"
          export PYTHONPATH=scripts
          python3 scripts/compile_hosted_product_pair.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-product-msi-pair
          path: ${{ steps.bundle.outputs.bundle_path }}
          if-no-files-found: error
          retention-days: 3
  native-product:
    needs: [build-product, author-pair]
    runs-on: windows-latest
    timeout-minutes: ${{ needs.author-pair.outputs.rollback_enabled == 'true' && 55 || 40 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.build-product.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.3"
      - run: npm ci --ignore-scripts --no-audit --prefix packaging/windows-msi/journey-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-product-msi-pair
          path: ${{ runner.temp }}/product-bundle
      - name: Native installed product journey on disposable hosted runner
        shell: pwsh
        env:
          PLAN_SHA: ${{ needs.author-pair.outputs.plan_sha }}
          EXERCISE_ROLLBACK: ${{ needs.author-pair.outputs.rollback_enabled }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $principal = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent())
          @{ runner='GitHub-hosted windows-latest'; isAdministrator=$principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator); standardUserAcceptance=$false; imageVersion=$env:ImageVersion } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'product-runner-context.json')
          $plan = Join-Path $env:RUNNER_TEMP 'product-bundle/product-plan.json'
          $journeyArgs = @('tests/desktop-installed-product-journey.mjs', '--plan', $plan, '--expected-plan-sha256', $env:PLAN_SHA, '--execute-in-disposable-windows')
          if ($env:EXERCISE_ROLLBACK -eq 'true') { $journeyArgs += '--exercise-product-rollback' }
          elseif ($env:EXERCISE_ROLLBACK -ne 'false') { throw 'Invalid rollback opt-in output' }
          node @journeyArgs
          if ($LASTEXITCODE -ne 0) { throw 'Native installed product journey failed; inspect retained evidence' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-installed-product-evidence
          path: |
            ${{ runner.temp }}/installed-product-journey-*/evidence/
            ${{ runner.temp }}/product-runner-context.json
          if-no-files-found: warn
          retention-days: 3
  native-standard-user:
    needs: [build-product, author-pair]
    # Hosted Windows Server disallows unmanaged MSI installs for ordinary users
    # (DisableMSI=1). The client image runs the same x64 media with Windows 11 emulation.
    runs-on: windows-11-arm
    timeout-minutes: ${{ needs.author-pair.outputs.rollback_enabled == 'true' && 55 || 40 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.build-product.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.3"
      - run: npm ci --ignore-scripts --no-audit --prefix packaging/windows-msi/journey-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-product-msi-pair
          path: ${{ runner.temp }}/product-bundle
      - name: Run installed product as a fresh local standard user
        shell: pwsh
        env:
          EXPECTED_PLAN: ${{ needs.author-pair.outputs.plan_sha }}
          ROLLBACK: ${{ needs.author-pair.outputs.rollback_enabled }}
        run: |
          ./scripts/run_standard_windows_journey.ps1 -Plan (Join-Path $env:RUNNER_TEMP 'product-bundle/product-plan.json') -PlanSha $env:EXPECTED_PLAN -Evidence (Join-Path $env:RUNNER_TEMP 'standard-user-evidence') -Rollback:($env:ROLLBACK -eq 'true')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standard-user-installed-product-evidence
          path: |
            ${{ runner.temp }}/standard-user-evidence/standard-context.json
            ${{ runner.temp }}/standard-user-evidence/child-*.log
            ${{ runner.temp }}/standard-user-evidence/installed-product-journey-*/evidence/
          if-no-files-found: warn
          retention-days: 7
