name: Validate Local API
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: local-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save --ignore-scripts playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.mjs
        env:
          PLAYWRIGHT_BUNDLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: ui-evidence
          path: |
            /tmp/local-api-*.png
            /tmp/local-api-trace.zip
            /tmp/local-api-video/
  desktop:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix desktop
      - run: npm audit --prefix desktop --audit-level=high
      - run: npx --no install-electron
        working-directory: desktop
      - run: npm install --no-save --ignore-scripts playwright@1.64.1
      - name: Install only production dependencies for the package
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('production',{recursive:true});for(const f of ['package.json','package-lock.json'])fs.copyFileSync(f,'production/'+f)"
          npm ci --omit=dev --ignore-scripts --prefix production
      - run: node scripts/build-desktop.mjs
      - run: node scripts/build-manifest.mjs
        env:
          BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: node tests/desktop-smoke.mjs
        if: runner.os != 'Linux'
      - run: xvfb-run --auto-servernum node tests/desktop-smoke.mjs
        if: runner.os == 'Linux'
      - name: Archive desktop executable permissions
        if: runner.os != 'Windows'
        run: tar -czf dist/LocalAPI-${{ runner.os }}.tar.gz -C dist LocalAPI
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-metadata-${{ runner.os }}
          retention-days: 7
          path: |
            desktop/package-lock.json
            dist/LocalAPI/build-manifest.json
            dist/desktop-failure.png
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: LocalAPI-${{ runner.os }}-portable
          path: |
            dist/LocalAPI-${{ runner.os }}.tar.gz
            ${{ runner.os == 'Windows' && 'dist/LocalAPI' || 'dist/LocalAPI/build-manifest.json' }}
  source-format:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: node scripts/build-markdown.mjs
      - run: git diff --exit-code -- public/vendor

  database-integration:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-root-fixture-only
          MYSQL_USER: tester
          MYSQL_PASSWORD: local-fixture-only
          MYSQL_DATABASE: fixture
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node tests/remote-database.mjs
