name: Validate Local API
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save --ignore-scripts playwright@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-smoke.mjs
        env:
          PLAYWRIGHT_BUNDLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 7
          name: ui-evidence
          path: |
            /tmp/local-api-*.png
            /tmp/local-api-trace.zip
            /tmp/local-api-video/
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm install --prefix desktop
      - run: npx --no install-electron
        working-directory: desktop
      - run: npm install --no-save --ignore-scripts playwright@1.64.1
      - name: Assemble portable Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/LocalAPI | Out-Null
          Copy-Item desktop/node_modules/electron/dist/* dist/LocalAPI -Recurse
          New-Item -ItemType Directory -Force dist/LocalAPI/resources/app | Out-Null
          Copy-Item src,public,scripts,node_modules,LICENSE dist/LocalAPI/resources/app -Recurse
          New-Item -ItemType Directory -Force dist/LocalAPI/resources/app/desktop | Out-Null
          Copy-Item desktop/*.mjs,desktop/*.cjs dist/LocalAPI/resources/app/desktop
          '{"name":"local-api-workbench","version":"0.1.0","type":"module","main":"desktop/main.mjs"}' | Set-Content dist/LocalAPI/resources/app/package.json
          Rename-Item dist/LocalAPI/electron.exe LocalAPI.exe
      - run: node tests/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: LocalAPI-Windows-portable
          path: dist/LocalAPI
  source-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
  database-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: local-fixture-only
          POSTGRES_DB: fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-root-fixture-only
          MYSQL_USER: tester
          MYSQL_PASSWORD: local-fixture-only
          MYSQL_DATABASE: fixture
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: node tests/remote-database.mjs
