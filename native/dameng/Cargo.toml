[package]
name = "workbench-dameng-read"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dm-rust = { path = "vendor/dm-rust" }
tokio = { version = "1", features = ["macros", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
